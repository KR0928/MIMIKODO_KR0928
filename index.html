<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIMIKODO対戦補助ツール</title>

<style>
body{
background:#1e1e1e;
color:white;
font-family:sans-serif;
max-width:1100px;
margin:auto;
padding:15px;
}

.section{
background:#2e2e2e;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

h1,h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #555;
padding:8px;
text-align:center;
}

button{
margin:3px;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.i{background:#ff7f50;}
.k{background:#4da6ff;}
.f{background:#90ee90;color:black;}
.j{background:#ffd700;color:black;}
.p{background:#ff69b4;}

#history{
max-height:250px;
overflow:auto;
}

.good{
color:lightgreen;
}

.bad{
color:#ff8080;
}
</style>
</head>

<body>

<h1>MIMIKODO 対戦補助ツール</h1>

<div class="section">

<h2>自分の手札</h2>

<table>
<tr><td>居合</td><td><input id="my_i" type="number" min="0" max="6" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>回避</td><td><input id="my_k" type="number" min="0" max="5" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>不動</td><td><input id="my_f" type="number" min="0" max="6" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>迅雷</td><td><input id="my_j" type="number" min="0" max="2" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>パリィ</td><td><input id="my_p" type="number" min="0" max="3" value="0" onchange="updateMyHand()"></td></tr>
</table>

<h3 id="handTotal" class="bad">0 / 10</h3>

</div>

<div class="section">

<h2>相手情報</h2>

<table id="enemyTable"></table>

<p>相手残り手札 : <span id="remainHand">10</span>枚</p>

</div>

<div class="section">

<h2>カードを見た</h2>

<button class="i" onclick="seeCard('居合')">居合</button>
<button class="k" onclick="seeCard('回避')">回避</button>
<button class="f" onclick="seeCard('不動')">不動</button>
<button class="j" onclick="seeCard('迅雷')">迅雷</button>
<button class="p" onclick="seeCard('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>見えていたカードが使用された</h2>

<button class="i" onclick="usedSeen('居合')">居合</button>
<button class="k" onclick="usedSeen('回避')">回避</button>
<button class="f" onclick="usedSeen('不動')">不動</button>
<button class="j" onclick="usedSeen('迅雷')">迅雷</button>
<button class="p" onclick="usedSeen('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>新規カードが使用された</h2>

<button class="i" onclick="usedNew('居合')">居合</button>
<button class="k" onclick="usedNew('回避')">回避</button>
<button class="f" onclick="usedNew('不動')">不動</button>
<button class="j" onclick="usedNew('迅雷')">迅雷</button>
<button class="p" onclick="usedNew('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>履歴</h2>
<div id="history"></div>
<br>
<button onclick="resetAll()">リセット</button>

</div>

<script>

const cards=["居合","回避","不動","迅雷","パリィ"];

let seen={};
let used={};

cards.forEach(c=>{
seen[c]=0;
used[c]=0;
});

let history=[];

function updateMyHand(){

let total=
Number(my_i.value)+
Number(my_k.value)+
Number(my_f.value)+
Number(my_j.value)+
Number(my_p.value);

let obj=document.getElementById("handTotal");

obj.innerHTML=total+" / 10";

if(total===10){
obj.className="good";
}else{
obj.className="bad";
}
}

function updateTable(){

let html=`
<tr>
<th>カード</th>
<th>現在見えている</th>
<th>使用済み</th>
</tr>
`;

cards.forEach(card=>{

html+=`
<tr>
<td>${card}</td>
<td>${seen[card]}</td>
<td>${used[card]}</td>
</tr>
`;

});

enemyTable.innerHTML=html;

let totalUsed=0;

cards.forEach(card=>{
totalUsed+=used[card];
});

remainHand.innerHTML=Math.max(10-totalUsed,0);

let text="";

history.forEach((h,i)=>{
text+=(i+1)+" . "+h+"<br>";
});

document.getElementById("history").innerHTML=text;

}

function seeCard(card){

seen[card]++;

history.push("見た → "+card);

updateTable();

}

function usedSeen(card){

if(seen[card]>0){

seen[card]--;
used[card]++;

history.push("見えていたカード使用 → "+card);

}else{

history.push("エラー → "+card+" が見えていません");

}

updateTable();

}

function usedNew(card){

used[card]++;

history.push("新規カード使用 → "+card);

updateTable();

}

function resetAll(){

if(!confirm("リセットしますか？")) return;

cards.forEach(c=>{
seen[c]=0;
used[c]=0;
});

history=[];

updateTable();

}

updateMyHand();
updateTable();

</script>

</body>
</html>
``
