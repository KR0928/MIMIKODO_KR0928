<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIMIKODO 対戦補助ツール</title>

<style>
body{
    background:#1e1e1e;
    color:white;
    font-family:sans-serif;
    max-width:1200px;
    margin:auto;
    padding:15px;
}

h1,h2{
    text-align:center;
}

.section{
    background:#2e2e2e;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #555;
    padding:8px;
    text-align:center;
}

button{
    margin:4px;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

input{
    width:70px;
    text-align:center;
    font-size:16px;
}

.i{background:#ff7f50;}
.k{background:#4da6ff;}
.f{background:#90ee90;color:black;}
.j{background:#ffd700;color:black;}
.p{background:#ff69b4;}
.ctrl{background:#666;color:white;}

#history{
    max-height:250px;
    overflow-y:auto;
}

.good{
    color:lightgreen;
}

.bad{
    color:#ff8080;
}
</style>
</head>

<body>

<h1>MIMIKODO 対戦補助ツール</h1>

<div class="section">

<h2>自分の手札</h2>

<table>
<tr>
<th>カード</th>
<th>枚数</th>
</tr>

<tr>
<td>居合</td>
<td><input type="number" id="my_i" min="0" max="6" value="0" onchange="updateMyTotal()"></td>
</tr>

<tr>
<td>回避</td>
<td><input type="number" id="my_k" min="0" max="5" value="0" onchange="updateMyTotal()"></td>
</tr>

<tr>
<td>不動</td>
<td><input type="number" id="my_f" min="0" max="6" value="0" onchange="updateMyTotal()"></td>
</tr>

<tr>
<td>迅雷</td>
<td><input type="number" id="my_j" min="0" max="2" value="0" onchange="updateMyTotal()"></td>
</tr>

<tr>
<td>パリィ</td>
<td><input type="number" id="my_p" min="0" max="3" value="0" onchange="updateMyTotal()"></td>
</tr>

</table>

<p>
手札合計 :
<span id="myTotal" class="bad">0 / 10</span>
</p>

</div>

<div class="section">

<h2>相手情報</h2>

<table id="enemyTable"></table>

<p>
判明枠 :
<span id="knownCount">0</span>/10
</p>

<p>
未判明枠 :
<span id="unknownCount">10</span>
</p>

</div>

<div class="section">

<h2>カードを見た</h2>

<button class="i" onclick="seeCard('居合')">居合</button>
<button class="k" onclick="seeCard('回避')">回避</button>
<button class="f" onclick="seeCard('不動')">不動</button>
<button class="j" onclick="seeCard('迅雷')">迅雷</button>
<button class="p" onclick="seeCard('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>見えていたカードが使用された</h2>

<button class="i" onclick="usedKnown('居合')">居合</button>
<button class="k" onclick="usedKnown('回避')">回避</button>
<button class="f" onclick="usedKnown('不動')">不動</button>
<button class="j" onclick="usedKnown('迅雷')">迅雷</button>
<button class="p" onclick="usedKnown('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>新規カードが使用された</h2>

<button class="i" onclick="usedNew('居合')">居合</button>
<button class="k" onclick="usedNew('回避')">回避</button>
<button class="f" onclick="usedNew('不動')">不動</button>
<button class="j" onclick="usedNew('迅雷')">迅雷</button>
<button class="p" onclick="usedNew('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>履歴</h2>

<div id="history"></div>

<br>

<button class="ctrl" onclick="resetAll()">リセット</button>

</div>

<script>

const deck={
"居合":6,
"回避":5,
"不動":6,
"迅雷":2,
"パリィ":3
};

let known={
"居合":0,
"回避":0,
"不動":0,
"迅雷":0,
"パリィ":0
};

let visible={
"居合":0,
"回避":0,
"不動":0,
"迅雷":0,
"パリィ":0
};

let history=[];

function updateMyTotal(){

let total=
Number(my_i.value)+
Number(my_k.value)+
Number(my_f.value)+
Number(my_j.value)+
Number(my_p.value);

let obj=document.getElementById("myTotal");

obj.innerText=total+" / 10";

if(total===10){
obj.className="good";
}
else{
obj.className="bad";
}

}

function nCr(n,r){

if(r<0 || r>n)return 0;

let result=1;

for(let i=1;i<=r;i++){
result=result*(n-r+i)/i;
}

return result;

}

function probability(card){

if(known[card]>0){
return 100;
}

let knownTotal=0;

for(let c in known){
knownTotal+=known[c];
}

let unknown=10-knownTotal;

let all=nCr(22,unknown);

let miss=nCr(22-deck[card],unknown);

if(all===0)return 0;

return (1-miss/all)*100;

}

function updateEnemy(){

let html=`
<tr>
<th>カード</th>
<th>確定枚数</th>
<th>見えている枚数</th>
<th>所持確率</th>
</tr>
`;

let total=0;

for(let card in deck){

total+=known[card];

html+=`
<tr>
<td>${card}</td>
<td>${known[card]}</td>
<td>${visible[card]}</td>
<td>${probability(card).toFixed(1)}%</td>
</tr>
`;

}

enemyTable.innerHTML=html;

knownCount.innerText=total;
unknownCount.innerText=Math.max(0,10-total);

renderHistory();

}

function renderHistory(){

let text="";

history.forEach((v,i)=>{

text += (i+1)+" . "+v+"<br>";

});

document.getElementById("history").innerHTML=text;

}

function seeCard(card){

known[card]++;
visible[card]++;

history.push("見た → "+card);

updateEnemy();

}

function usedKnown(card){

if(visible[card]>0){

visible[card]--;

history.push("見えていたカード使用 → "+card);

}
else{

history.push("エラー : "+card+" が見えていません");

}

updateEnemy();

}

function usedNew(card){

known[card]++;

history.push("新規カード使用 → "+card);

updateEnemy();

}

function resetAll(){

if(!confirm("リセットしますか？")){
return;
}

for(let c in known){
known[c]=0;
visible[c]=0;
}

history=[];

updateEnemy();

}

updateMyTotal();
updateEnemy();

</script>

</body>
</html>
