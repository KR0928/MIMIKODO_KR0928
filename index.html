<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIMIKODO 対戦補助ツール</title>

<style>
body{
background:#1e1e1e;
color:white;
font-family:sans-serif;
max-width:1200px;
margin:auto;
padding:15px;
}

.section{
background:#2d2d2d;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

h1,h2{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #555;
padding:8px;
text-align:center;
}

button{
margin:3px;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

input{
width:70px;
text-align:center;
}

.i{background:#ff7f50;}
.k{background:#4da6ff;}
.f{background:#90ee90;color:black;}
.j{background:#ffd700;color:black;}
.p{background:#ff69b4;}

.good{color:lightgreen;}
.bad{color:#ff8080;}

#history{
max-height:250px;
overflow:auto;
}
</style>
</head>
<body>

<h1>MIMIKODO 対戦補助ツール</h1>

<div class="section">

<h2>自分の手札</h2>

<table>
<tr><td>居合</td><td><input id="my_i" type="number" min="0" max="6" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>回避</td><td><input id="my_k" type="number" min="0" max="5" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>不動</td><td><input id="my_f" type="number" min="0" max="6" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>迅雷</td><td><input id="my_j" type="number" min="0" max="2" value="0" onchange="updateMyHand()"></td></tr>
<tr><td>パリィ</td><td><input id="my_p" type="number" min="0" max="3" value="0" onchange="updateMyHand()"></td></tr>
</table>

<h3 id="myTotal" class="bad">0 / 10</h3>

</div>

<div class="section">

<h2>相手情報</h2>

<table id="enemyTable"></table>

<p>相手残り手札 : <span id="enemyHand">10</span>枚</p>

</div>

<div class="section">

<h2>カードを見た</h2>

<button class="i" onclick="see('居合')">居合</button>
<button class="k" onclick="see('回避')">回避</button>
<button class="f" onclick="see('不動')">不動</button>
<button class="j" onclick="see('迅雷')">迅雷</button>
<button class="p" onclick="see('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>見えていたカードが使用された</h2>

<button class="i" onclick="usedSeen('居合')">居合</button>
<button class="k" onclick="usedSeen('回避')">回避</button>
<button class="f" onclick="usedSeen('不動')">不動</button>
<button class="j" onclick="usedSeen('迅雷')">迅雷</button>
<button class="p" onclick="usedSeen('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>新規カードが使用された</h2>

<button class="i" onclick="usedNew('居合')">居合</button>
<button class="k" onclick="usedNew('回避')">回避</button>
<button class="f" onclick="usedNew('不動')">不動</button>
<button class="j" onclick="usedNew('迅雷')">迅雷</button>
<button class="p" onclick="usedNew('パリィ')">パリィ</button>

</div>

<div class="section">

<h2>履歴</h2>

<div id="history"></div>

<br>

<button onclick="resetAll()">リセット</button>

</div>

<script>

const deck={
"居合":6,
"回避":5,
"不動":6,
"迅雷":2,
"パリィ":3
};

let visible={};
let used={};

Object.keys(deck).forEach(card=>{
visible[card]=0;
used[card]=0;
});

let history=[];

function updateMyHand(){

let total=
Number(my_i.value)+
Number(my_k.value)+
Number(my_f.value)+
Number(my_j.value)+
Number(my_p.value);

myTotal.textContent=total+" / 10";

if(total===10){
myTotal.className="good";
}
else{
myTotal.className="bad";
}
}

function nCr(n,r){

if(r<0 || r>n) return 0;
if(r===0 || r===n) return 1;

let result=1;

for(let i=1;i<=r;i++){
result=result*(n-r+i)/i;
}

return result;
}

function probability(card){

if(visible[card] > 0) return 100;

let remainingCard =
deck[card] - used[card];

if(remainingCard<=0) return 0;

let usedTotal=0;

for(let c in used){
usedTotal += used[c];
}

let remainingDeck = 22 - usedTotal;

let handRemain = 10 - usedTotal;

if(handRemain<=0) return 0;

let totalComb=nCr(remainingDeck,handRemain);

let missComb=nCr(
remainingDeck-remainingCard,
handRemain
);

if(totalComb===0) return 0;

return (1-missComb/totalComb)*100;

}

function updateTable(){

let html=`
<tr>
<th>カード</th>
<th>見えている</th>
<th>使用済み</th>
<th>残り枚数</th>
<th>所持確率</th>
</tr>
`;

let usedTotal=0;

for(let c in used){
usedTotal+=used[c];
}

for(let card in deck){

let remain=
Math.max(
0,
deck[card]-used[card]
);

html+=`
<tr>
<td>${card}</td>
<td>${visible[card]}</td>
<td>${used[card]}</td>
<td>${remain}</td>
<td>${probability(card).toFixed(1)}%</td>
</tr>
`;
}

enemyTable.innerHTML=html;

enemyHand.textContent=
Math.max(
0,
10-usedTotal
);

let text="";

history.forEach((h,i)=>{
text+=(i+1)+". "+h+"<br>";
});

document.getElementById("history").innerHTML=text;

}

function see(card){

visible[card]++;

history.push("見た → "+card);

updateTable();

}

function usedSeen(card){

if(visible[card]<=0){

history.push("エラー → "+card+"が見えていません");

updateTable();
return;

}

visible[card]--;
used[card]++;

history.push("見えていたカード使用 → "+card);

updateTable();

}

function usedNew(card){

used[card]++;

history.push("新規カード使用 → "+card);

updateTable();

}

function resetAll(){

if(!confirm("リセットしますか？")){
return;
}

for(let card in deck){
visible[card]=0;
used[card]=0;
}

history=[];

updateTable();

}

updateMyHand();
updateTable();

</script>

</body>
</html>
